<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Payment result · NomuPay APM Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brandmark" href="/" style="text-decoration:none;color:inherit">
        <span class="logo" aria-hidden="true">N</span>
        <div>
          <h1>NomuPay APM Demo</h1>
          <div class="sub">Payment result</div>
        </div>
      </a>
      <div class="envbar"><a class="secondary" href="/" id="backLink">New test payment</a></div>
    </div>
  </header>

  <main class="result-wrap">
    <section class="card">
      <div class="card-head">
        <div class="big-status" id="bigStatus"><span class="pill">Checking status…</span></div>
        <div class="actions"><button class="secondary" type="button" id="recheck">Check again</button></div>
      </div>
      <div class="card-body" id="body">
        <p class="muted">Asking the gateway for the latest status.</p>
      </div>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="/result.js"></script>
</body>
</html>
